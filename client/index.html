<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Primal Edge — Adaptive Intelligence. Decisive Signals.</title>
    <meta name="description" content="Primal Edge — Adaptive Intelligence. Decisive Signals. AI-powered quantitative trading signals across a premium multi-index universe. Graded breakout setups and instant push alerts for serious traders." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0d12" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // Umami analytics — loaded only when build-time env vars are defined
      // Uses import.meta.env (Vite JS API) to avoid HTML %% env scanning
      const ep = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const wid = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;
      if (ep && wid) {
        const s = document.createElement("script");
        s.defer = true;
        s.src = ep + "/umami";
        s.setAttribute("data-website-id", wid);
        document.head.appendChild(s);
      }
    </script>
  </body>
</html>
